<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 980" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f43f5e"/>
    </marker>
    <marker id="arrV" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b5cf6"/>
    </marker>
    <style>
      .title{font-size:30px;font-weight:800;fill:#0f172a}
      .sub{font-size:15px;fill:#475569}
      .nlabel{font-size:16px;font-weight:700;fill:#0f172a}
      .ntype{font-size:10.5px;font-weight:700;letter-spacing:.6px}
      .ptitle{font-size:16px;font-weight:800;fill:#0f172a}
      .pline{font-size:12.5px;fill:#334155}
      .pmono{font-size:12px;fill:#0f172a;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
      .flow{stroke:#64748b;stroke-width:2.4;fill:none;marker-end:url(#arr)}
      .correct{stroke:#f43f5e;stroke-width:2.2;fill:none;stroke-dasharray:6 4;marker-end:url(#arrR)}
      .observe{stroke:#8b5cf6;stroke-width:2;fill:none;stroke-dasharray:2 5;marker-end:url(#arrV)}
      .elabel{font-size:12px;font-weight:600;fill:#475569}
      .clabel{font-size:12px;font-weight:700;fill:#e11d48}
      .legt{font-size:12.5px;fill:#334155;font-weight:600}
      .foot{font-size:12.5px;fill:#64748b}
      .badge{font-size:11px;font-weight:700;fill:#fff}
    </style>
  </defs>

  <rect width="1440" height="980" fill="url(#bg)"/>

  <!-- Title -->
  <text x="60" y="56" class="title">Agentic RAG on ClickHouse + Langfuse</text>
  <text x="60" y="82" class="sub">Corrective-RAG (CRAG) loop · ClickHouse-native vector search · full agent observability · embeddings all-MiniLM-L6-v2 (384d) · LLM Claude Sonnet 4</text>

  <!-- ================= ENTRY POINTS ================= -->
  <g filter="url(#shadow)">
    <rect x="110" y="120" width="300" height="66" rx="12" fill="#ffffff" stroke="#6366f1" stroke-width="2.5"/>
    <rect x="1030" y="120" width="300" height="66" rx="12" fill="#ffffff" stroke="#6366f1" stroke-width="2.5"/>
  </g>
  <text x="260" y="150" text-anchor="middle" class="nlabel">LangGraph service</text>
  <text x="260" y="172" text-anchor="middle" class="sub">FastAPI :8006 · CLI  —  in-process</text>
  <text x="1180" y="150" text-anchor="middle" class="nlabel">LibreChat agent</text>
  <text x="1180" y="172" text-anchor="middle" class="sub">no-code  —  via rag-retriever MCP</text>

  <text x="720" y="158" text-anchor="middle" font-size="14" font-weight="700" fill="#94a3b8">two front-ends → one loop → one vector store</text>

  <!-- entry arrows into the loop container -->
  <path class="flow" d="M260,186 C260,235 300,250 340,288"/>
  <path class="flow" d="M1180,186 C1180,235 1140,250 1100,288"/>

  <!-- ================= CRAG LOOP CONTAINER ================= -->
  <rect x="80" y="288" width="1280" height="316" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="80" y="288" width="1280" height="30" rx="18" fill="#0f172a"/>
  <rect x="80" y="303" width="1280" height="15" fill="#0f172a"/>
  <text x="100" y="309" class="badge">AGENTIC CRAG LOOP  ·  each node = a typed Langfuse observation</text>

  <!-- nodes: helper layout. box w150 h72, main row center y=472 (top 436) -->
  <!-- ROUTE (agent) -->
  <g filter="url(#shadow)"><rect x="120" y="436" width="150" height="72" rx="12" fill="#fff" stroke="#6366f1" stroke-width="2.5"/></g>
  <text x="195" y="466" text-anchor="middle" class="nlabel">route</text>
  <text x="195" y="486" text-anchor="middle" class="ntype" fill="#6366f1">AGENT</text>
  <text x="195" y="500" text-anchor="middle" font-size="10" fill="#64748b">kb · sql · direct</text>

  <!-- RETRIEVE (retriever) -->
  <g filter="url(#shadow)"><rect x="360" y="436" width="150" height="72" rx="12" fill="#fff" stroke="#14b8a6" stroke-width="2.5"/></g>
  <text x="435" y="468" text-anchor="middle" class="nlabel">retrieve</text>
  <text x="435" y="488" text-anchor="middle" class="ntype" fill="#0d9488">RETRIEVER</text>

  <!-- GRADE (evaluator) -->
  <g filter="url(#shadow)"><rect x="600" y="436" width="150" height="72" rx="12" fill="#fff" stroke="#f43f5e" stroke-width="2.5"/></g>
  <text x="675" y="466" text-anchor="middle" class="nlabel">grade</text>
  <text x="675" y="486" text-anchor="middle" class="ntype" fill="#e11d48">EVALUATOR</text>
  <text x="675" y="500" text-anchor="middle" font-size="9.5" fill="#64748b">→ retrieval_relevance</text>

  <!-- GENERATE (generation) -->
  <g filter="url(#shadow)"><rect x="840" y="436" width="150" height="72" rx="12" fill="#fff" stroke="#3b82f6" stroke-width="2.5"/></g>
  <text x="915" y="468" text-anchor="middle" class="nlabel">generate</text>
  <text x="915" y="488" text-anchor="middle" class="ntype" fill="#2563eb">GENERATION</text>

  <!-- REFLECT (evaluator) -->
  <g filter="url(#shadow)"><rect x="1080" y="436" width="150" height="72" rx="12" fill="#fff" stroke="#f43f5e" stroke-width="2.5"/></g>
  <text x="1155" y="466" text-anchor="middle" class="nlabel">reflect</text>
  <text x="1155" y="486" text-anchor="middle" class="ntype" fill="#e11d48">EVALUATOR</text>
  <text x="1155" y="500" text-anchor="middle" font-size="9.5" fill="#64748b">→ groundedness</text>

  <!-- END pill -->
  <g filter="url(#shadow)"><rect x="1268" y="450" width="74" height="44" rx="22" fill="#0f172a"/></g>
  <text x="1305" y="477" text-anchor="middle" class="badge">END</text>

  <!-- REWRITE (agent) above -->
  <g filter="url(#shadow)"><rect x="477" y="346" width="150" height="60" rx="12" fill="#fff" stroke="#6366f1" stroke-width="2.5"/></g>
  <text x="552" y="372" text-anchor="middle" class="nlabel">rewrite</text>
  <text x="552" y="391" text-anchor="middle" class="ntype" fill="#6366f1">AGENT</text>

  <!-- SQL_TOOL (tool) below -->
  <g filter="url(#shadow)"><rect x="120" y="536" width="150" height="60" rx="12" fill="#fff" stroke="#f59e0b" stroke-width="2.5"/></g>
  <text x="195" y="562" text-anchor="middle" class="nlabel">sql_tool</text>
  <text x="195" y="581" text-anchor="middle" class="ntype" fill="#d97706">TOOL</text>

  <!-- main flow arrows -->
  <path class="flow" d="M270,472 L356,472"/>
  <text x="313" y="462" text-anchor="middle" class="elabel">kb</text>
  <path class="flow" d="M510,472 L596,472"/>
  <path class="flow" d="M750,472 L836,472"/>
  <text x="793" y="462" text-anchor="middle" class="elabel">relevant</text>
  <path class="flow" d="M990,472 L1076,472"/>
  <path class="flow" d="M1230,472 L1264,472"/>
  <text x="1247" y="462" text-anchor="middle" class="elabel">✓</text>

  <!-- correction loop: grade -> rewrite -> retrieve -->
  <path class="correct" d="M640,436 C620,410 600,400 600,400 L632,376"/>
  <text x="566" y="424" text-anchor="middle" class="clabel">not relevant</text>
  <path class="correct" d="M477,378 C430,372 420,400 430,432"/>
  <text x="430" y="360" text-anchor="middle" class="clabel">re-retrieve</text>

  <!-- route -> sql_tool -> generate -->
  <path class="flow" d="M195,508 L195,532"/>
  <text x="216" y="525" class="elabel">sql</text>
  <path class="flow" d="M270,566 C520,566 700,560 880,512"/>
  <text x="540" y="586" text-anchor="middle" class="elabel">tool result → generate</text>

  <!-- reflect -> generate (regeneration) -->
  <path class="correct" d="M1110,508 C1060,556 980,556 945,512"/>
  <text x="1030" y="556" text-anchor="middle" class="clabel">not grounded → regenerate</text>

  <!-- ================= STORAGE + OBSERVABILITY ================= -->
  <!-- ClickHouse vectors -->
  <g filter="url(#shadow)"><rect x="120" y="664" width="380" height="180" rx="14" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/></g>
  <rect x="120" y="664" width="380" height="34" rx="14" fill="#f59e0b"/>
  <rect x="120" y="681" width="380" height="17" fill="#f59e0b"/>
  <text x="140" y="687" class="badge">ClickHouse 26.3 — dedicated vector store</text>
  <text x="140" y="726" class="pline">Database <tspan class="pmono">agentic_rag.kb_chunks</tspan></text>
  <text x="140" y="752" class="pmono">embedding  Array(Float32)</text>
  <text x="140" y="778" class="pmono">INDEX vector_similarity('hnsw',</text>
  <text x="140" y="796" class="pmono">      'cosineDistance', 384)</text>
  <text x="140" y="824" class="pline">+ 26.2 GA text index · QBit (query-time precision)</text>

  <!-- ClickHouse public demo -->
  <g filter="url(#shadow)"><rect x="540" y="664" width="340" height="180" rx="14" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/></g>
  <rect x="540" y="664" width="340" height="34" rx="14" fill="#fbbf24"/>
  <rect x="540" y="681" width="340" height="17" fill="#fbbf24"/>
  <text x="560" y="687" class="badge" fill="#0f172a">ClickHouse public demo (SQL tool)</text>
  <text x="560" y="726" class="pmono">sql.clickhouse.com</text>
  <text x="560" y="754" class="pline">35+ real datasets:</text>
  <text x="560" y="776" class="pline">nyc_taxi · github · stackoverflow ·</text>
  <text x="560" y="796" class="pline">hackernews · imdb · wikipedia …</text>
  <text x="560" y="824" class="pline">live SELECT via the agent's sql_tool</text>

  <!-- Langfuse -->
  <g filter="url(#shadow)"><rect x="920" y="664" width="420" height="180" rx="14" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/></g>
  <rect x="920" y="664" width="420" height="34" rx="14" fill="#7c3aed"/>
  <rect x="920" y="681" width="420" height="17" fill="#7c3aed"/>
  <text x="940" y="687" class="badge">Langfuse — agent observability</text>
  <text x="940" y="726" class="pline">▸ Agent Graph (typed observations)</text>
  <text x="940" y="752" class="pline">▸ Scores: <tspan font-weight="700" fill="#e11d48">retrieval_relevance</tspan> (span, per attempt)</text>
  <text x="958" y="772" class="pline"><tspan font-weight="700" fill="#e11d48">groundedness</tspan> (trace-level)</text>
  <text x="940" y="798" class="pline">▸ Sessions · cost · latency · token usage</text>
  <text x="940" y="824" class="pline">backed by its own ClickHouse 25.8 (untouched)</text>

  <!-- arrows to storage -->
  <path class="flow" d="M420,510 C380,580 330,610 320,660"/>
  <text x="300" y="600" text-anchor="middle" class="elabel">vector search</text>
  <path class="flow" d="M210,596 C260,630 540,650 660,660"/>
  <text x="470" y="640" text-anchor="middle" class="elabel">SELECT</text>
  <path class="observe" d="M1180,608 L1140,660"/>
  <text x="1210" y="640" text-anchor="middle" class="elabel" fill="#7c3aed">observations + scores</text>

  <!-- ================= LEGEND ================= -->
  <text x="60" y="906" class="legt" font-weight="800">Observation types:</text>
  <g>
    <rect x="220" y="895" width="16" height="16" rx="4" fill="#fff" stroke="#6366f1" stroke-width="2.5"/><text x="244" y="908" class="legt">agent</text>
    <rect x="320" y="895" width="16" height="16" rx="4" fill="#fff" stroke="#14b8a6" stroke-width="2.5"/><text x="344" y="908" class="legt">retriever</text>
    <rect x="440" y="895" width="16" height="16" rx="4" fill="#fff" stroke="#f59e0b" stroke-width="2.5"/><text x="464" y="908" class="legt">tool</text>
    <rect x="530" y="895" width="16" height="16" rx="4" fill="#fff" stroke="#3b82f6" stroke-width="2.5"/><text x="554" y="908" class="legt">generation</text>
    <rect x="660" y="895" width="16" height="16" rx="4" fill="#fff" stroke="#f43f5e" stroke-width="2.5"/><text x="684" y="908" class="legt">evaluator</text>
  </g>
  <line x1="800" y1="903" x2="828" y2="903" class="correct"/><text x="836" y="908" class="legt">self-correction</text>
  <line x1="980" y1="903" x2="1008" y2="903" class="observe"/><text x="1016" y="908" class="legt">trace export</text>

  <text x="60" y="952" class="foot">Two front-ends share one CRAG loop and one ClickHouse-native vector store. LangGraph runs it in-process; LibreChat drives the identical retrieval via the rag-retriever MCP tool.</text>
</svg>

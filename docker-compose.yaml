services:
  # LibreChat API with OpenTelemetry instrumentation
  api:
    build:
      context: .
      dockerfile: Dockerfile.otel
    container_name: librechat-api
    ports:
      - "3080:3080"
    depends_on:
      - mongodb
      - meilisearch
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - NODE_ENV=production
      - MONGO_URI=${MONGO_URI:-mongodb://mongodb:27017/LibreChat}
      - MEILI_HOST=${MEILI_HOST:-http://meilisearch:7700}
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY:-DrhYf7zENyR6AlUCKmnz0eYASOQdl6zxH7s7MKFSfFCt}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://host.docker.internal:4318
      - CLICKSTACK_API_KEY=${CLICKSTACK_API_KEY}
      - CONSOLE_JSON=${CONSOLE_JSON:-true}
      - DEBUG_CONSOLE=${DEBUG_CONSOLE:-true}
    volumes:
      - ./librechat.yaml:/app/librechat.yaml:ro
      - ./uploads:/app/client/public/images/uploads
      - ./logs:/app/api/logs
      - ./images:/app/client/public/images

  # Nginx reverse proxy
  client:
    image: nginx:1.27.0-alpine
    container_name: librechat-nginx
    ports:
      - "80:80"
    depends_on:
      - api
    restart: always
    volumes:
      - ./client/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  # MongoDB database
  mongodb:
    image: mongo:latest
    container_name: librechat-mongodb
    restart: always
    volumes:
      - ./data-node:/data/db

  # Meilisearch for full-text search
  meilisearch:
    image: getmeili/meilisearch:v1.12.3
    container_name: librechat-meilisearch
    restart: always
    environment:
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY:-DrhYf7zENyR6AlUCKmnz0eYASOQdl6zxH7s7MKFSfFCt}
      - MEILI_NO_ANALYTICS=true
    volumes:
      - ./meili_data:/meili_data

  # OpenTelemetry Collector for logs and metrics
  otelcol:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: librechat-otelcol
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - CLICKSTACK_API_KEY=${CLICKSTACK_API_KEY}
    volumes:
      - ./otel-file-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
      - ./logs:/var/log/librechat:ro
      - ./mcp-logs:/var/log/mcp-clickhouse:ro
    command: ["--config=/etc/otelcol-contrib/config.yaml"]

  # ClickHouse MCP Server with OpenTelemetry instrumentation
  mcp-clickhouse:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    container_name: mcp-clickhouse
    ports:
      - "8001:8000"
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - CLICKHOUSE_HOST=${CLICKHOUSE_HOST:-sql-clickhouse.clickhouse.com}
      - CLICKHOUSE_USER=${CLICKHOUSE_USER:-demo}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-}
      - CLICKHOUSE_SECURE=true
      - CLICKHOUSE_MCP_SERVER_TRANSPORT=sse
      - CLICKHOUSE_MCP_BIND_HOST=0.0.0.0
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://host.docker.internal:4317
      - OTEL_SERVICE_NAME=mcp-clickhouse
      - CLICKSTACK_API_KEY=${CLICKSTACK_API_KEY}
    volumes:
      - ./mcp-logs:/app/logs

  # =============================================================================
  # Text-to-SQL Demo with TruLens + OpenLLMetry
  # =============================================================================
  text-to-sql:
    build:
      context: .
      dockerfile: Dockerfile.text-to-sql
    container_name: text-to-sql
    ports:
      - "${TEXT_TO_SQL_PORT:-8002}:8000"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - CLICKSTACK_API_KEY=${CLICKSTACK_API_KEY}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://clickstack:4318/v1/traces
      - MCP_SERVER_URL=http://mcp-clickhouse:8000/sse
      - OTEL_SERVICE_NAME=text-to-sql-demo
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-sonnet-4-20250514}
      - TEMPERATURE=${TEMPERATURE:-0.7}
      - TRULENS_MODEL=${TRULENS_MODEL:-claude-3-5-haiku-20241022}
      - TRULENS_DATABASE_URL=sqlite:////trulens-data/trulens.sqlite
    depends_on:
      - mcp-clickhouse
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./text-to-sql:/app
      - trulens-data:/trulens-data

  # =============================================================================
  # Vector RAG Demo - Proper RAG with embeddings and vector search
  # =============================================================================
  vector-rag:
    build:
      context: .
      dockerfile: Dockerfile.vector-rag
    container_name: vector-rag
    ports:
      - "${VECTOR_RAG_PORT:-8003}:8000"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - CLICKSTACK_API_KEY=${CLICKSTACK_API_KEY}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://clickstack:4318/v1/traces
      - OTEL_SERVICE_NAME=vector-rag-demo
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-sonnet-4-20250514}
      - TEMPERATURE=${TEMPERATURE:-0.7}
      - TRULENS_MODEL=${TRULENS_MODEL:-claude-3-5-haiku-20241022}
      - TRULENS_DATABASE_URL=sqlite:////trulens-data/trulens.sqlite
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./vector-rag:/app
      - trulens-data:/trulens-data

  # =============================================================================
  # TruLens Dashboard - Unified dashboard for all apps
  # =============================================================================
  trulens-dashboard:
    build:
      context: .
      dockerfile: Dockerfile.trulens-dashboard
    container_name: trulens-dashboard
    ports:
      - "8501:8501"
    environment:
      - TRULENS_DATABASE_URL=sqlite:////trulens-data/trulens.sqlite
      - TRULENS_OTEL_TRACING=0
    volumes:
      - trulens-data:/trulens-data

  # =============================================================================
  # Trace Evaluator - Async quality evaluation from HyperDX traces
  # =============================================================================
  # This service queries LLM traces from ClickHouse and runs TruLens evaluations.
  # Run manually: docker compose run trace-evaluator --help
  #
  # Examples:
  #   docker compose run trace-evaluator --list-services
  #   docker compose run trace-evaluator --service librechat-api --hours 24
  #   docker compose run trace-evaluator --sample-rate 0.05
  # =============================================================================
  trace-evaluator:
    build:
      context: .
      dockerfile: Dockerfile.trace-evaluator
    container_name: trace-evaluator
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - CLICKSTACK_API_KEY=${CLICKSTACK_API_KEY}
      # ClickHouse connection (ClickStack uses 'api' user with password 'api')
      - CLICKHOUSE_TRACE_HOST=clickstack
      - CLICKHOUSE_TRACE_PORT=8123
      - CLICKHOUSE_TRACE_DATABASE=default
      - CLICKHOUSE_TRACE_USER=api
      - CLICKHOUSE_TRACE_PASSWORD=api
      # TruLens configuration
      - TRULENS_DATABASE_URL=sqlite:////trulens-data/trulens.sqlite
      - TRULENS_MODEL=${TRULENS_MODEL:-claude-3-5-haiku-20241022}
      # OpenTelemetry for evaluator traces
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://clickstack:4318/v1/traces
      - OTEL_SERVICE_NAME=trace-evaluator
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - trulens-data:/trulens-data
    # Don't auto-start - run manually with docker compose run
    profiles:
      - tools

  # =============================================================================
  # Test Scenarios - Export synthetic conversations for evaluation demos
  # =============================================================================
  # Exports pre-crafted prompt/response pairs that demonstrate evaluation failures:
  # - Low Relevance: Off-topic responses
  # - Low Coherence: Contradictory responses
  # - Hallucination: Fabricated information
  #
  # Run: docker compose run test-scenarios
  # List: docker compose run test-scenarios --list
  # =============================================================================
  test-scenarios:
    build:
      context: .
      dockerfile: Dockerfile.test-scenarios
    container_name: test-scenarios
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://clickstack:4318/v1/traces
      - CLICKSTACK_API_KEY=${CLICKSTACK_API_KEY}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    profiles:
      - tools

  # =============================================================================
  # LibreChat Exporter - Export conversations to ClickHouse via OTLP
  # =============================================================================
  # This service reads LibreChat conversations from MongoDB and exports them
  # as OpenTelemetry traces with gen_ai.* semantic conventions.
  # Run manually: docker compose run librechat-exporter --help
  #
  # Examples:
  #   docker compose run librechat-exporter --list-conversations
  #   docker compose run librechat-exporter --hours 24
  #   docker compose run librechat-exporter --watch --interval 60
  # =============================================================================
  librechat-exporter:
    build:
      context: .
      dockerfile: Dockerfile.librechat-exporter
    container_name: librechat-exporter
    environment:
      # MongoDB connection (LibreChat's database)
      - MONGO_URI=mongodb://librechat-mongodb:27017/LibreChat
      # OTLP endpoint (ClickStack/HyperDX)
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://clickstack:4318/v1/traces
      - OTEL_SERVICE_NAME=librechat-conversations
      - CLICKSTACK_API_KEY=${CLICKSTACK_API_KEY}
    depends_on:
      - mongodb
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Don't auto-start - run manually with docker compose run
    profiles:
      - tools

volumes:
  trulens-data:

# Manifest for the litellm-gateway container demo (see docs/DEMO_STANDARD_SPEC.md §6)
# Nothing needs seeding; run_demo.sh is the existing readiness + trace check (spec D8).
name: litellm-gateway
title: LiteLLM Gateway
pitch: Centralized observability at the AI gateway, where a LiteLLM proxy exports every call to Langfuse over OTLP, with no SDK in the client
profile: container
status: active
covers: [trace, gateway]
stack: [python, litellm, openai-sdk, docker]
langfuse:
  target: either             # run_demo.sh branches on DEPLOY_MODE
  project: LLM Observability Demo   # optional dedicated project via LITELLM_LANGFUSE_* keys
length:
  full_min: 5
commands:
  run: ./demos/litellm-gateway/run_demo.sh
  verify: ./demos/litellm-gateway/run_demo.sh
  test: python -m unittest discover -s tests -v
waivers:
  - rule: DS-README-02
    reason: predates the standard
  - rule: DS-README-04
    reason: predates the standard
  - rule: DS-README-05
    reason: predates the standard
  - rule: DS-SCRIPT-03
    reason: predates the standard
  - rule: DS-SCRIPT-04
    reason: predates the standard

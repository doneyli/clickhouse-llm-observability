# Manifest for the support-triage-parallel container demo (see docs/DEMO_STANDARD_SPEC.md §6)
name: support-triage-parallel
title: Support Triage Parallel
pitch: Parallel ticket triage with 4-branch sectioning and best-of-N SQL voting counted by ClickHouse
profile: container
status: active
covers: [trace, monitor, experiment, evaluate]
stack: [python, anthropic-sdk, asyncio, clickhouse, docker]
langfuse:
  target: self-hosted
  project: LLM Observability Demo
length:
  full_min: 15-20
  short_min: 8
commands:
  install: pip install -r requirements.txt pytest
  seed: python demos/support-triage-parallel/scripts/seed_all.py
  run: docker compose --profile demo run --rm support-triage-parallel python main.py
  verify: python demos/support-triage-parallel/scripts/verify_demo.py   # to be written
  test: python -m pytest -q
waivers:
  - rule: DS-README-02
    reason: predates the standard
  - rule: DS-README-03
    reason: predates the standard
  - rule: DS-README-04
    reason: predates the standard
  - rule: DS-SCRIPT-03
    reason: predates the standard
  - rule: DS-SCRIPT-05
    reason: predates the standard
  - rule: DS-VERIFY-01
    reason: predates the standard

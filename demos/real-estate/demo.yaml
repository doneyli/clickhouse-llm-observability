name: real-estate
title: Property Concierge
pitch: An agentic property concierge that walks the whole AI engineering loop, from tracing to prompt deploy by label and a GitHub CI gate
profile: standalone
status: active
covers: [trace, monitor, datasets, experiment, evaluate, deploy]
stack: [python, anthropic-sdk, openai-sdk, langgraph, langchain, fastapi]
langfuse:
  target: either
  project: real-estate
length:
  full_min: 18-24
  short_min: 6-8
commands:
  install: uv venv --python 3.11 .venv && uv pip install -p .venv/bin/python -r requirements.txt
  seed: .venv/bin/python scripts/seed_all.py      # to be written: wraps seed_prompts, seed_dataset, seed_managed_evaluators and the other seed_*.py scripts
  run: ./run_demo.sh
  verify: .venv/bin/python scripts/smoke_test.py
  test: .venv/bin/python scripts/test_photo_scoring.py
addons:
  # Existing file names kept (decision D8).
  - cicd: [cicd/README.md, cicd/thresholds.json, ../../.github/workflows/langfuse-prompt-ci.yml]
  - portal: run_portal.sh
waivers:
  - rule: DS-README-02
    reason: predates the standard
  - rule: DS-README-03
    reason: predates the standard
  - rule: DS-README-04
    reason: predates the standard
  - rule: DS-SCRIPT-03
    reason: predates the standard
  - rule: DS-SCRIPT-05
    reason: predates the standard
  - rule: DS-SEED-01
    reason: predates the standard
  - rule: DS-SPEC-01
    reason: predates the standard

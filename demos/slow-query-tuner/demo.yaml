# Manifest for the slow-query-tuner container demo (see docs/DEMO_STANDARD_SPEC.md §6)
name: slow-query-tuner
title: Slow Query Tuner
pitch: Autonomous plan-act-observe agent that tunes a slow ClickHouse query and decides when it is fast enough, with spend caps and a kill switch
profile: container
status: active
covers: [trace, monitor, datasets, experiment, evaluate]
stack: [python, anthropic-sdk, clickhouse, docker]
langfuse:
  target: self-hosted
  project: LLM Observability Demo
length:
  full_min: 25
  short_min: 12
commands:
  install: pip install -r requirements-dev.txt
  seed: python demos/slow-query-tuner/scripts/seed_all.py
  run: docker compose --profile demo run --rm slow-query-tuner python main.py --query q1
  verify: python demos/slow-query-tuner/scripts/verify_demo.py   # to be written
  test: python -m pytest -q
waivers:
  - rule: DS-README-02
    reason: predates the standard
  - rule: DS-README-03
    reason: predates the standard
  - rule: DS-README-04
    reason: predates the standard
  - rule: DS-README-05
    reason: predates the standard
  - rule: DS-SCRIPT-03
    reason: predates the standard
  - rule: DS-SCRIPT-04
    reason: predates the standard
  - rule: DS-SCRIPT-05
    reason: predates the standard
  - rule: DS-VERIFY-01
    reason: predates the standard

name: langfuse-enterprise-operations
title: Langfuse Enterprise Operations
pitch: Real platform lifecycle automation from a local portal, covering projects, RBAC, key rotation, audit evidence and reviewed reset
profile: standalone
status: active
covers: [governance, operations]
stack: [python, docker]
langfuse:
  target: self-hosted
  # An organization, not a project: the org key in private/org.env acts on the whole organization and the
  # portal creates its projects live. "Demo Organization" is the root stack's LANGFUSE_INIT_ORG_NAME
  # (docker-compose.yaml). verify_demo.py confirms the name when the instance API is enabled.
  project: Demo Organization
length:
  full_min: 20-30
commands:
  seed: python3 scripts/seed_all.py     # private/ setup + the Protected labels workflow (governance project, personas)
  run: ./scripts/run-portal.sh
  verify: python3 scripts/verify_demo.py
  test: python3 -B -m unittest discover -s tests
  reset: ./scripts/reset-demo.sh
addons:
  - spec
  - architecture: docs/architecture.md   # existing lower-case name kept (decision D8)
  - portal: scripts/run-portal.sh        # existing kebab-case name kept (decision D8)

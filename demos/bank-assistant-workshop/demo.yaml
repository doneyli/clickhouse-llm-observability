name: bank-assistant-workshop
title: Bank Assistant Workshop
pitch: Nine-module hands-on workshop that adds tracing, prompts, monitoring and experiments to a synthetic bank assistant
profile: workshop
status: draft
covers: [trace, monitor, datasets, experiment, evaluate, deploy]
stack: [python, langgraph, mcp, fastapi, anthropic-sdk, openai-sdk]
langfuse:
  target: cloud
  project: banking-workshop   # the instructor's rehearsal project (docs/2026-10-12-live-rehearsal.md); attendees set DEMO_LANGFUSE_PROJECT
length:
  full_min: 180
commands:
  install: uv venv --python 3.12 .venv && uv pip install --python .venv/bin/python -r requirements.txt
  seed: .venv/bin/python scripts/seed_all.py   # idempotent: workshop.py prompt + dataset, only on drift
  run: .venv/bin/python workshop.py serve
  verify: .venv/bin/python scripts/verify_demo.py   # workshop.py preflight + Langfuse read-back
  test: .venv/bin/python -m unittest discover -s tests -t .
addons:
  - spec

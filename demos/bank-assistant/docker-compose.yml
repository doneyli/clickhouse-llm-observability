# Northwind Bank (fictional) — the pieces a bank's AI platform team plugs into Langfuse:
# an n8n instance (low-code) and Jaeger for infrastructure observability through
# OpenTelemetry. Telemetry is off — the same "no egress" posture a regulated VPC imposes.
#
#   docker compose up -d        (or ./scripts/up.sh)
#
# Langfuse itself is NOT in this file. The demo targets a Langfuse Cloud project
# (.env.cloud), the ONE local self-hosted Langfuse shared by every standalone demo
# (.env.selfhosted, from `python scripts/langfuse_local.py provision bank-assistant` at
# the repository root — it reuses a running v4 instance or starts infra/langfuse-local),
# or both. The shared stack is the official Langfuse v4 compose file with the Enterprise
# license, batch export to object storage and telemetry off; see
# infra/langfuse-local/docker-compose.yml. Production guidance — managed Postgres/Redis/S3,
# ClickHouse BYOC, HA — is in docs/ARCHITECTURE.md and docs/OPERATIONS.md.

name: northwind

services:
  # ── Infrastructure observability (Jaeger, OBS-06) ─────────────────────────
  # Receives the SAME OpenTelemetry spans (same trace id) the app sends to
  # Langfuse. Configure APM_OTLP_ENDPOINT for another OTLP backend.
  # Vendor integration example: docs/DYNATRACE.md.
  jaeger:
    image: jaegertracing/jaeger:2.22.0
    restart: always
    ports:
      - 16686:16686          # UI
      - 127.0.0.1:14318:4318 # OTLP/HTTP

  # ── Low-code (OBS-02) ──────────────────────────────────────────────────────
  # n8n's built-in OpenTelemetry module exports one span per workflow run and
  # per node straight to ONE Langfuse OTLP endpoint (the profile's primary target). The
  # workflow itself adds the LLM generations under the same trace id (see n8n/README.md).
  # scripts/setup_n8n.sh writes the N8N_OTEL_* values into .env.
  n8n:
    image: docker.n8n.io/n8nio/n8n:${N8N_VERSION:-latest}
    restart: always
    ports:
      - 5678:5678
    environment:
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_SECURE_COOKIE: "false"
      GENERIC_TIMEZONE: UTC
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_COMMUNITY_PACKAGES_ALLOW_TOOL_USAGE: "true"
      N8N_OTEL_ENABLED: ${N8N_OTEL_ENABLED:-false}
      N8N_OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      N8N_OTEL_EXPORTER_OTLP_ENDPOINT: ${N8N_OTEL_EXPORTER_OTLP_ENDPOINT:-}
      N8N_OTEL_EXPORTER_OTLP_HEADERS: ${N8N_OTEL_EXPORTER_OTLP_HEADERS:-}
      N8N_OTEL_EXPORTER_SERVICE_NAME: n8n-northwind
      N8N_OTEL_TRACES_INCLUDE_NODE_SPANS: "true"
      N8N_OTEL_TRACES_SAMPLE_RATE: "1.0"
      # Demo: also trace runs started from the editor. Keep "true" in production.
      N8N_OTEL_TRACES_PRODUCTION_ONLY: "false"
      OTEL_RESOURCE_ATTRIBUTES: ${N8N_OTEL_RESOURCE_ATTRIBUTES:-deployment.environment=production}
    # A local Langfuse runs in another compose project: n8n reaches it through the host
    # (scripts/setup_n8n.sh rewrites localhost URLs to host.docker.internal).
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n:/workflows:ro

volumes:
  n8n_data:

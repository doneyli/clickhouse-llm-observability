# Insurance claims demo — local infrastructure.
#
#   docker compose --profile apm up -d           → Jaeger (Dynatrace stand-in) on :16686 / OTLP :14318
#                                                 skip it if the bank demo's Jaeger already runs there
#
# Langfuse itself is NOT in this file. The demo targets a Langfuse Cloud project (.env.cloud), the ONE local
# self-hosted Langfuse shared by every standalone demo (.env.selfhosted, from
# `python scripts/langfuse_local.py provision insurance-claims` at the repository root — it reuses a running v4
# instance or starts infra/langfuse-local with the Enterprise license from the repo-root .env), or both.
# scripts/bootstrap_selfhosted.sh adds the Enterprise governance state (projects, RBAC, protected label).

name: claims

services:
  jaeger:
    profiles: [apm]
    image: jaegertracing/jaeger:2.22.0
    ports:
      - "16686:16686"
      - "127.0.0.1:14318:4318"
    restart: unless-stopped

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claims Workbench</title>
<!-- Paths are relative on purpose: portal/server.py mounts static/ with html=True at "/", not at /static. -->
<link rel="icon" type="image/svg+xml" href="northwind-mark.svg">
<link rel="stylesheet" href="clickui-tokens.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="top">
  <div class="brand"><span class="logo">N</span><div><b>Northwind Life &amp; Annuity</b><small>Death-claims workbench · synthetic demo data</small></div></div>
  <div class="top-right">
    <label class="presenter"><input type="checkbox" id="presenter"> Presenter view</label>
    <a id="lf-link" target="_blank" rel="noopener" aria-label="Open this project in Langfuse" title="Open this project in Langfuse"><img src="langfuse-by-clickhouse-white.svg" alt="Langfuse by ClickHouse" width="79" height="21"><span aria-hidden="true">↗</span></a>
  </div>
</header>
<main>
  <aside class="queue">
    <div class="queue-head"><h2>Claim queue</h2>
      <select id="filter"><option value="all">All claims</option><option value="hero">Featured</option><option value="golden">Standard</option><option value="adversarial">Flagged / adversarial</option></select>
    </div>
    <input id="search" placeholder="Search id, scenario, state…">
    <ul id="claims"></ul>
  </aside>
  <section id="detail" class="detail"><div class="empty">Select a claim from the queue.</div></section>
</main>
<div id="modal" class="modal hidden"><div class="modal-body"><button class="close" id="modal-close">×</button><div id="modal-content"></div></div></div>
<script src="app.js"></script>
</body>
</html>

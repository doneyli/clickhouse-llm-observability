# Manifest for the vector-rag container demo (see docs/DEMO_STANDARD_SPEC.md §6)
name: vector-rag
title: Vector RAG
pitch: The naive-RAG baseline, fully traced, with ChromaDB retrieval and a Langfuse-managed generation prompt shipped by label
profile: container
status: active
covers: [trace, evaluate, deploy]
stack: [python, langchain, chromadb, fastapi, docker]
langfuse:
  target: self-hosted
  project: LLM Observability Demo
length:
  full_min: 10-12
  short_min: 5
commands:
  install: pip install pytest   # no tests today; avoids the torch-sized app deps
  seed: python scripts/seed-app-prompts.py
  run: docker compose --profile demo run --rm vector-rag python main.py
  verify: python demos/vector-rag/scripts/verify_demo.py   # to be written
  test: python -m pytest -q
waivers:
  - rule: DS-README-01
    reason: predates the standard
  - rule: DS-SCRIPT-03
    reason: predates the standard
  - rule: DS-SCRIPT-05
    reason: predates the standard
  - rule: DS-TEST-01
    reason: predates the standard
  - rule: DS-VERIFY-01
    reason: predates the standard

# Manifest for the vector-rag container demo (see docs/DEMO_STANDARD_SPEC.md §6)
name: vector-rag
title: Vector RAG
pitch: The naive-RAG baseline, fully traced, with ChromaDB retrieval and a Langfuse-managed generation prompt shipped by label
profile: container
status: active
covers: [trace, evaluate, deploy]
stack: [python, langchain, chromadb, fastapi, docker]
langfuse:
  target: self-hosted
  project: LLM Observability Demo
length:
  full_min: 10-12
  short_min: 5
commands:
  install: pip install -r requirements-dev.txt   # pytest only: the tests stub LangChain, ChromaDB and torch
  seed: python demos/vector-rag/scripts/seed_all.py   # root .env, then the root helper scripts/seed-app-prompts.py
  run: docker compose --profile demo run --rm vector-rag python main.py
  verify: python demos/vector-rag/scripts/verify_demo.py
  test: python -m pytest -q

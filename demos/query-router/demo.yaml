# Manifest for the query-router container demo (see docs/DEMO_STANDARD_SPEC.md §6)
name: query-router
title: Query Router
pitch: Front-door classification and dispatch with a confidence gate, fallback, human escalation and router-accuracy evals
profile: container
status: active
covers: [trace, monitor, datasets, experiment, evaluate]
stack: [python, anthropic-sdk, fastapi, docker]
langfuse:
  target: self-hosted
  project: LLM Observability Demo
length:
  full_min: 15
  short_min: 6
commands:
  install: pip install -r requirements-dev.txt
  seed: python demos/query-router/scripts/seed_all.py   # wraps seed-router-prompt/-dataset/-history, seed-code-evaluators.sh, seed-router-judge.sh
  run: docker compose --profile demo run --rm query-router python main.py
  verify: python demos/query-router/scripts/verify_demo.py
  test: python -m pytest -q

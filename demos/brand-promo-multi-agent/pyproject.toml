[project]
name = "brand-promo-multi-agent"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-anthropic>=0.2.0",
    "langchain-core>=0.3.0",
    "crewai>=0.80.0",
    "crewai-tools>=0.12.0",
    "langfuse>=4.7,<5.0",
    "anthropic>=0.40.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "rich>=13.0",
    "typer>=0.12",
    "tenacity>=9.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.6", "pytest>=8.0", "pytest-asyncio>=0.24", "mypy>=1.10"]
market = ["tavily-python>=0.5"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# LibreChat Configuration
version: "1.2.1"

# Enable caching
cache: true

# MCP Servers Configuration
# Note: stdio-based MCP servers using mcp-clickhouse require glibc (chdb dependency).
# Alpine Linux uses musl, so we use SSE transport via the mcp-clickhouse container instead.
mcpServers:
  clickhouse-playground:
    type: sse
    url: http://mcp-clickhouse:8000/sse

  # Agentic RAG retriever (ClickHouse-native vector search over the KB)
  rag-retriever:
    type: sse
    url: http://mcp-rag-retriever:8000/sse
    # Pass the stable per-conversation id so the MCP server can group a
    # multi-turn chat into ONE Langfuse session (one trace per turn). LibreChat
    # resolves {{LIBRECHAT_BODY_CONVERSATIONID}} per tool call from a
    # server-assigned UUID (stable from turn 1). server.py reads this header.
    headers:
      X-LibreChat-Conversation-Id: "{{LIBRECHAT_BODY_CONVERSATIONID}}"

  # Langfuse Traces (query LLM trace data via natural language)
  langfuse-traces:
    type: sse
    url: http://mcp-clickhouse-langfuse:8000/sse

  # Langfuse Prompt Management (MCP Server)
  # Enables agents to manage Langfuse prompts directly from chat
  langfuse-prompts:
    type: streamable-http
    url: http://langfuse-web:3000/api/public/mcp
    headers:
      Authorization: "Basic ${LANGFUSE_MCP_AUTH_TOKEN}"
    # Langfuse advertises OAuth, but we authenticate with the static Basic header
    # above (project API keys). OAuth auto-detection probes WITHOUT our headers,
    # sees Langfuse's 401 WWW-Authenticate, and misclassifies this as OAuth-only.
    # This top-level flag bypasses that probe so the static header is used for
    # global tool discovery. (Must be top-level, NOT nested under `oauth:`.)
    requiresOAuth: false

# MCP Security: Allow internal Docker network domains for MCP servers
mcpSettings:
  allowedDomains:
    - "mcp-clickhouse:8000"
    - "mcp-clickhouse-langfuse:8000"
    - "mcp-rag-retriever:8000"
    - "langfuse-web:3000"

# Agent Configuration
endpoints:
  # Shared settings applied to ALL endpoints (overrides per-endpoint config).
  # titleConvo: false disables LibreChat's automatic conversation-title generation.
  # Each titled chat would otherwise emit a separate "TitleRun" trace into Langfuse
  # (a small LLM call to name the thread) that clutters the trace list and looks like
  # a junk agent run in a demo. Disabling keeps every Langfuse trace a real "LibreChat"
  # trace (renamed from LibreChat's internal "AgentRun" in librechat/entrypoint.sh).
  # To re-enable titles, set this to true (and optionally filter Trace Name = LibreChat
  # in Langfuse to hide the TitleRun traces).
  all:
    titleConvo: false
  agents:
    recursionLimit: 50
  bedrock:
    availableRegions:
      - us-east-1
      - us-west-2

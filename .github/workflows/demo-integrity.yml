name: Demo integrity

# The cheap gates that would have caught most of the defects found in the first
# live pass over the spec demos (PR #71). None of them run the demos or need a
# Langfuse instance, an API key, or Docker services — they are seconds of CI that
# close off whole classes of silent breakage:
#
#   - dependency resolution: four demos pinned `langfuse<4.0.0` while importing
#     v4-only `propagate_attributes`, so under their own pins they could not
#     import at all. A static review reported them clean; `pip install` catches it
#     immediately. A keep-both-sides merge conflict also left two conflicting
#     langfuse pins in one requirements.txt, which pip refuses outright.
#   - shell syntax: a merge artifact left setup.sh unparseable ("line 912: syntax
#     error: unexpected end of file"), i.e. the repo's documented entry point
#     could not run, and nothing noticed.
#   - compose validity PER PROFILE: `yaml.safe_load` silently accepts duplicate
#     mapping keys (last wins) where Docker's parser rejects them, so a Python
#     "it parses" check passes on a file Docker refuses. And a cross-profile
#     depends_on invalidates the WHOLE project under one profile combination
#     while validating fine under another — so each combination must be checked.
#   - instrumentation wrappers: the tracing contextmanagers used to hold the
#     caller's block inside `try/except Exception`, which swallowed application
#     exceptions, mislabelled them as Langfuse failures, and replaced them with
#     "RuntimeError: generator didn't stop after throw()".

on:
  pull_request:
    paths:
      - 'demos/**'
      - 'docker-compose.yaml'
      - 'setup.sh'
      - 'scripts/**.sh'
      - 'scripts/demo_standard.py'
      - 'scripts/check-demo-structure.py'
      - 'scripts/gen-demo-index.py'
      - 'scripts/new-demo.py'
      - 'scripts/tests/**'
      - '.github/workflows/demo-integrity.yml'
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  enterprise-operations:
    name: enterprise operations unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test portal workflows and state migration without live services
        run: python -B -m unittest discover -s demos/langfuse-enterprise-operations/tests -v

  # The demo standard (demos/CONTRIBUTING.md). The checker and the index generator
  # need only PyYAML; the matrices below are built from each demo's demo.yaml, so a
  # new demo is covered as soon as its manifest lands.
  demo-structure:
    name: demos follow the standard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pyyaml
      - name: tooling tests (checker, generator, schema)
        run: python -m unittest discover -s scripts/tests
      - name: check-demo-structure (waived rules are reported as notices)
        run: python scripts/check-demo-structure.py --format github
      - name: generated index and cards are committed
        run: python scripts/gen-demo-index.py --check

  template-self-test:
    name: a scaffolded demo passes with no waivers
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: [container, standalone, workshop]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pyyaml
      - name: scaffold, regenerate, check --strict
        run: |
          # The runner's checkout is throwaway, so the demo is scaffolded into the
          # real demos/ folder: the index, links and card rules then see it exactly
          # as they would see a committed demo.
          name="zz-selftest-${{ matrix.profile }}"
          python scripts/new-demo.py "$name" --profile "${{ matrix.profile }}" \
            --title "Self-test ${{ matrix.profile }}" --pitch "Template self-test for the ${{ matrix.profile }} profile"
          python scripts/check-demo-structure.py --strict --demo "$name" --format github
          python scripts/gen-demo-index.py --check

  manifests:
    name: build matrices from demo.yaml
    runs-on: ubuntu-latest
    outputs:
      pip-demos: ${{ steps.m.outputs.pip }}
      test-demos: ${{ steps.m.outputs.tests }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pyyaml
      - id: m
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          # On a pull request, demo-tests runs only the demos the PR touches, plus
          # every demo when the shared tooling changes. On main and on dispatch it
          # runs them all.
          changed=""
          if [ "$EVENT" = "pull_request" ]; then
            changed="$(git diff --name-only "origin/$BASE_REF...HEAD")"
          fi
          CHANGED="$changed" python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, sys
          sys.path.insert(0, "scripts")
          import demo_standard as ds
          event = os.environ["EVENT"]
          changed = [c for c in os.environ.get("CHANGED", "").splitlines() if c]
          shared = any(c.startswith((".github/workflows/demo-integrity.yml", "scripts/demo_standard.py"))
                       for c in changed)
          pip, tests = [], []
          for d in ds.discover():
              if not d.valid or d.manifest.get("status") == "archived":
                  continue
              if (d.path / "requirements.txt").is_file():
                  pip.append(d.name)
              has_tests = any(
                  p.name.startswith("test_") and p.suffix == ".py" or p.name.endswith("_test.py")
                  or ".test." in p.name or ".spec." in p.name
                  for p in d.path.rglob("*")
                  if p.is_file() and not ({"node_modules", ".venv", "venv"} & set(p.parts)))
              touched = event != "pull_request" or shared or any(c.startswith(f"demos/{d.name}/") for c in changed)
              if has_tests and touched:
                  cmds = d.manifest["commands"]
                  tests.append({"name": d.name, "install": cmds.get("install", ""), "test": cmds["test"]})
          print("pip=" + json.dumps(pip))
          print("tests=" + json.dumps(tests))
          PY
          cat "$GITHUB_OUTPUT"

  deps-resolve:
    name: requirements.txt resolves
    needs: manifests
    if: needs.manifests.outputs.pip-demos != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        demo: ${{ fromJSON(needs.manifests.outputs.pip-demos) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: pip install --dry-run (resolution only, no build)
        run: |
          cd "demos/${{ matrix.demo }}"
          # --dry-run still runs the full resolver, so a conflicting pin fails
          # here, but nothing is installed or compiled — keeps this to seconds.
          python -m pip install --upgrade pip >/dev/null
          python -m pip install --dry-run -r requirements.txt

  demo-tests:
    name: demo tests (${{ matrix.demo.name }})
    needs: manifests
    if: needs.manifests.outputs.test-demos != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        demo: ${{ fromJSON(needs.manifests.outputs.test-demos) }}
    defaults:
      run:
        working-directory: demos/${{ matrix.demo.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: commands.install
        if: matrix.demo.install != ''
        env:
          CMD: ${{ matrix.demo.install }}
        run: bash -euo pipefail -c "$CMD"
      - name: commands.test (no services, no network to Langfuse or models)
        env:
          CMD: ${{ matrix.demo.test }}
          # Tests must not reach a real Langfuse. Some demos validate their keys at
          # import, so give them obvious placeholders and point any client that
          # slips through at a closed local port: nothing leaves the runner.
          LANGFUSE_PUBLIC_KEY: pk-lf-ci-placeholder
          LANGFUSE_SECRET_KEY: sk-lf-ci-placeholder
          LANGFUSE_BASE_URL: http://127.0.0.1:9
          LANGFUSE_HOST: http://127.0.0.1:9
        run: bash -euo pipefail -c "$CMD"

  shell-syntax:
    name: shell scripts parse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash -n every shell script
        run: |
          fail=0
          while IFS= read -r -d '' f; do
            if ! bash -n "$f" 2>/tmp/err; then
              echo "::error file=$f::$(head -1 /tmp/err)"
              fail=1
            fi
          done < <(find . -name '*.sh' -not -path './.git/*' -print0)
          # setup.sh is the documented entry point — call it out explicitly.
          if ! bash -n setup.sh; then
            echo "::error file=setup.sh::setup.sh does not parse"
            fail=1
          fi
          exit $fail

  compose-valid:
    name: compose validates per profile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker compose config for each profile combination
        run: |
          # A real .env is required, not just --env-file: services declare
          # `env_file: - .env` (the shell-key hardening), and Compose resolves
          # that path itself regardless of --env-file, so config fails with
          # "env file .../.env not found" without it. The runner is ephemeral.
          cp .env.example .env
          fail=0
          check() {
            if docker compose "$@" config >/dev/null 2>/tmp/err; then
              echo "  ok    [$*]"
            else
              echo "::error::docker compose $* config failed: $(head -1 /tmp/err)"
              fail=1
            fi
          }
          check
          check --profile demo
          check --profile langfuse
          check --profile tools
          check --profile dashboard
          check --profile langfuse --profile demo
          check --profile langfuse --profile demo --profile tools --profile dashboard
          exit $fail
      - name: Verify instance key isolation with all profiles enabled
        run: |
          docker compose --profile '*' config --format json |
            jq -e 'all(.services[]; .environment.ADMIN_API_KEY == null)'
          printf '%s\n' 'ADMIN_API_KEY=ci-fixture' > "$RUNNER_TEMP/instance.env"
          printf '\nLANGFUSE_INSTANCE_ENV_FILE=%s/instance.env\n' "$RUNNER_TEMP" >> .env
          docker compose --profile '*' config --format json |
            jq -e '(.services."langfuse-web".environment.ADMIN_API_KEY == "ci-fixture") and
              all(.services | del(."langfuse-web")[]; .environment.ADMIN_API_KEY == null)'

  instrumentation-safety:
    name: tracing wrappers do not swallow caller exceptions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: no yield inside a try body that has except handlers
        run: |
          python - <<'PY'
          import ast, glob, sys
          bad = []
          for path in sorted(glob.glob('demos/*/langfuse_config.py')):
              tree = ast.parse(open(path).read())
              for fn in ast.walk(tree):
                  if not isinstance(fn, (ast.FunctionDef, ast.AsyncFunctionDef)):
                      continue
                  deco = [getattr(d, 'id', getattr(d, 'attr', None)) for d in fn.decorator_list]
                  if 'contextmanager' not in deco:
                      continue
                  # A `yield` inside Try.body where the Try has handlers means an
                  # exception raised by the CALLER is thrown in at that yield and
                  # caught by the handler — swallowing the application's own error.
                  # (A yield inside an `except` handler is fine: that is the
                  # setup-failure degradation path.)
                  for node in ast.walk(fn):
                      if isinstance(node, ast.Try) and node.handlers:
                          for stmt in node.body:
                              if any(isinstance(s, (ast.Yield, ast.YieldFrom))
                                     for s in ast.walk(stmt)):
                                  bad.append(f'{path}:{fn.lineno} {fn.name}()')
                                  break
          for b in sorted(set(bad)):
              print(f'::error::{b} yields inside a guarded try — caller exceptions '
                    f'will be swallowed and replaced by RuntimeError. Guard only '
                    f'instrumentation SETUP (see contextlib.ExitStack pattern).')
          sys.exit(1 if bad else 0)
          PY

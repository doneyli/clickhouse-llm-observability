# Multi-agent handoff demo — prompt quality gate in CI (DON-245, SPEC §11).
#
# WHAT IT DOES
#   Same template as claims-prompt-gate.yml. A Langfuse prompt automation (Prompts → Automations →
#   GitHub Repository Dispatch, event type `handoff-prompt-update`) fires on every prompt version or
#   label change in the multi-agent-handoff project. This workflow reads the prompt and labels from the
#   payload, starts the two A2A agent services on the runner, and runs handoff-routing on the a2a
#   topology with that label (demos/multi-agent-handoff/scripts/prompt_gate.py), against
#   demos/multi-agent-handoff/cicd/thresholds.json. A regression FAILS the job and blocks "Ship it".
#
# SETUP (once) — see demos/multi-agent-handoff/cicd/README.md
#   Repo secrets: HANDOFF_LANGFUSE_BASE_URL, HANDOFF_LANGFUSE_PUBLIC_KEY, HANDOFF_LANGFUSE_SECRET_KEY,
#   ANTHROPIC_API_KEY. The Langfuse automation is a UI step (no public API).
#
# DEMO TIP
#   Actions → Handoff prompt gate → Run workflow → concierge + `fault-f1` → BLOCKED on routing-accuracy;
#   concierge + `candidate` (the F1 fix, scripts/loop.py fix) → passes.
name: Handoff prompt gate

on:
  repository_dispatch:
    types: [handoff-prompt-update]
  workflow_dispatch:
    inputs:
      prompt_name:
        description: Prompt to gate
        required: true
        default: concierge
        type: choice
        options: [concierge, tech-support, billing]
      prompt_label:
        description: Label to gate
        required: true
        default: candidate
        type: choice
        options: [candidate, production, fault-f1, fault-f3]

concurrency:
  # One group per prompt VERSION: a promotion can send more than one event; grouping by name alone would
  # let a housekeeping event cancel the gate of the version that matters.
  group: handoff-gate-${{ github.event.client_payload.prompt.name || github.event.inputs.prompt_name }}-${{ github.event.client_payload.prompt.version || github.event.inputs.prompt_label }}
  cancel-in-progress: true

jobs:
  gate:
    name: Evaluate the prompt against the quality bar
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      label: ${{ steps.which.outputs.label }}
      version: ${{ steps.which.outputs.version }}
      name: ${{ steps.which.outputs.name }}
      is_production: ${{ steps.which.outputs.is_production }}
      skip: ${{ steps.which.outputs.skip }}
    defaults:
      run:
        working-directory: demos/multi-agent-handoff
    steps:
      - uses: actions/checkout@v4

      - name: Decide which prompt version to gate
        id: which
        working-directory: .
        env:
          MANUAL_LABEL: ${{ github.event.inputs.prompt_label }}
          MANUAL_NAME: ${{ github.event.inputs.prompt_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          SKIP=""
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            NAME="$MANUAL_NAME"; LABEL="$MANUAL_LABEL"; LABELS="$MANUAL_LABEL"; VERSION=""
          else
            NAME=$(jq -r '.client_payload.prompt.name // ""' "$GITHUB_EVENT_PATH")
            VERSION=$(jq -r '.client_payload.prompt.version // "?"' "$GITHUB_EVENT_PATH")
            LABELS=$(jq -r '(.client_payload.prompt.labels // []) | join(",")' "$GITHUB_EVENT_PATH")
            LABEL=$(jq -r '(.client_payload.prompt.labels // [])
                           | map(select(. == "production" or . == "candidate" or . == "fault-f1" or . == "fault-f3"))
                           | (map(select(. == "production")) + .) | first // ""' "$GITHUB_EVENT_PATH")
            if [[ ! "$VERSION" =~ ^[1-9][0-9]*$ ]]; then
              SKIP="The dispatch must name a positive integer prompt version."
              VERSION=""
            fi
          fi
          case "$NAME" in
            concierge|tech-support|billing) ;;
            *) SKIP="Prompt is not one of: concierge, tech-support, billing."; NAME="" ;;
          esac
          case "$LABEL" in
            production|candidate|fault-f1|fault-f3) ;;
            *) SKIP="No deployable label (production, candidate, fault-f1, fault-f3)."; LABEL="" ;;
          esac
          IS_PROD=false; case ",$LABELS," in *,production,*) IS_PROD=true ;; esac
          echo "name=$NAME" >> "$GITHUB_OUTPUT"; echo "label=$LABEL" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "is_production=$IS_PROD" >> "$GITHUB_OUTPUT"; echo "skip=$SKIP" >> "$GITHUB_OUTPUT"
          { echo "### Prompt change"; echo ""; echo "| field | value |"; echo "|---|---|"
            echo "| prompt | \`$NAME\` |"; echo "| version | \`${VERSION:-resolved at gate start}\` |"; echo "| labels | \`${LABELS:-none}\` |"
            if [ -n "$SKIP" ]; then echo ""; echo "### ⏭️ Skipped — nothing evaluated"; echo ""; echo "$SKIP"
            else echo "| gating label | \`$LABEL\` |"; fi; echo ""; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-python@v5
        if: steps.which.outputs.skip == ''
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: demos/multi-agent-handoff/requirements.txt

      - name: Install
        if: steps.which.outputs.skip == ''
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt

      # The agents and run_services.sh read the demo's .env (they ignore shell LANGFUSE_* on purpose).
      - name: Write the demo .env (from secrets)
        if: steps.which.outputs.skip == ''
        env:
          DEMO_BASE_URL: ${{ secrets.HANDOFF_LANGFUSE_BASE_URL }}
          DEMO_PUBLIC_KEY: ${{ secrets.HANDOFF_LANGFUSE_PUBLIC_KEY }}
          DEMO_SECRET_KEY: ${{ secrets.HANDOFF_LANGFUSE_SECRET_KEY }}
          DEMO_ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          umask 077
          {
            printf 'LANGFUSE_BASE_URL=%s\n' "$DEMO_BASE_URL"
            printf 'LANGFUSE_PUBLIC_KEY=%s\n' "$DEMO_PUBLIC_KEY"
            printf 'LANGFUSE_SECRET_KEY=%s\n' "$DEMO_SECRET_KEY"
            printf 'ANTHROPIC_API_KEY=%s\n' "$DEMO_ANTHROPIC_KEY"
            printf 'HANDOFF_RELEASE=ci-%s\n' "$GITHUB_RUN_NUMBER"
          } > .env

      - name: Start the A2A agents (billing, tech-support)
        if: steps.which.outputs.skip == ''
        run: ./scripts/run_services.sh

      # Non-zero exit on any hard-threshold miss IS the gate.
      - name: Gate — handoff-routing on the a2a topology
        if: steps.which.outputs.skip == ''
        env:
          PROMPT_NAME: ${{ steps.which.outputs.name }}
          PROMPT_LABEL: ${{ steps.which.outputs.label }}
          PROMPT_VERSION: ${{ steps.which.outputs.version }}
        run: |
          args=(--prompt "$PROMPT_NAME" --label "$PROMPT_LABEL")
          if [ -n "$PROMPT_VERSION" ]; then args+=(--version "$PROMPT_VERSION"); fi
          .venv/bin/python scripts/prompt_gate.py "${args[@]}" \
            --run-name "ci · $PROMPT_NAME $PROMPT_LABEL v{version} · #$GITHUB_RUN_NUMBER"

      - name: Agent logs
        if: always() && steps.which.outputs.skip == ''
        run: tail -n 50 .run/*.log || true

  deploy:
    name: Ship it
    needs: gate
    runs-on: ubuntu-latest
    if: needs.gate.outputs.is_production == 'true' && needs.gate.outputs.skip == ''
    steps:
      - name: Announce the deploy
        env:
          PROMPT_NAME: ${{ needs.gate.outputs.name }}
          PROMPT_LABEL: ${{ needs.gate.outputs.label }}
        run: |
          {
            echo "### 🚀 Deployed"
            echo ""
            echo "\`$PROMPT_NAME\` (label \`$PROMPT_LABEL\`) passed the quality bar and carries \`production\`."
            echo "The agents fetch the production-labelled prompt at runtime (60 s cache): nothing to redeploy. Roll back = move the label back (scripts/loop.py promote --version N)."
          } >> "$GITHUB_STEP_SUMMARY"

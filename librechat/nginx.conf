# Nginx configuration for LibreChat reverse proxy

server {
    listen 80;
    listen [::]:80;
    server_name localhost;
    client_max_body_size 25M;

    # Thumbs feedback (PUT /api/messages/:conv/:msg/feedback) is handled by the
    # generic /api/ proxy below: LibreChat v0.8.6+ writes the Langfuse
    # `user-feedback` score natively, so no mirror/feedback-bridge is needed.

    location /api/ {
        proxy_pass http://api:3080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://api:3080/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
